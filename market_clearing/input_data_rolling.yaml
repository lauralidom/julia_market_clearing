# Rolling horizon parameters
rolling_horizon:
  simulation_month: 1             # 1=Jan ... 12=Dec
  simulation_days: 30             # auto-overwritten from simulation_month (year fixed to 2025)
  look_ahead_window: 24           # hours to optimise ahead
  reclear_frequency: 1            # reclear every N hours
  gate_closure: 1                 # hours locked from gate closure (no adjustment allowed)
  forecast_noise_std: 0.20        # standard deviation of wind forecast noise (0 = no noise)


# Generator parameters
dispatchableGenerators:
 Base:
  bidPrice: 30 # EUR/MWh
  capacity: 6000 # MW
  rampRate: 0.20 # fraction of capacity per hour (20% = 200 MW/h for 1000 MW unit)
  startupTime: 0 # hours required after shutdown before producing again
  initGen: 0.8 # initial generation as fraction of capacity (80%)

 Mid:
  bidPrice: 80 # EUR/MWh
  capacity: 4000 # MW
  rampRate: 0.50 # fraction of capacity per hour (50% = 250 MW/h for 500 MW unit)
  startupTime: 0 # hours required after shutdown before producing again
  initGen: 0.5 # initial generation as fraction of capacity (50%)

 Peak:
  bidPrice: 150 # EUR/MWh
  capacity: 5000 # MW
  rampRate: 1.0 # fraction of capacity per hour (100% = 500 MW/h for 500 MW unit)
  startupTime: 0 # hours required after shutdown before producing again
  initGen: 0.0 # initial generation as fraction of capacity (0%)

variableGenerators:
  Wind:
    bidPrice: 0         # EUR/MWh
    capacity: 12000      # MW - Combined onshore + offshore wind capacity
    # Real data from Dutch system - January 2025 (kW data converted to MW)
    # NOTE: CSV contains actual generation in kW (converted to MW by dividing by 1000)
    # Combines onshore and offshore wind
    dataFile: 
      - "data/windon_data_2025_ned.csv"
      - "data/windoff_data_2025_ned.csv"
    dataColumn: "volume (kWh)"
    dateColumn: "validfrom (UTC)"
    conversionFactor: 0.00095  # Convert kW to MW and scale renewables to 95%
    startDate: "2025-01-01 00:00:00"
    endDate: "2025-01-30 23:00:00"
  Solar:
    bidPrice: 0         # EUR/MWh
    capacity: 29000     # MW
    # Real data from Dutch system - January 2025 (kW data converted to MW)
    # NOTE: CSV contains actual generation in kW (converted to MW by dividing by 1000)
    dataFile: "data/solar_data_2025_ned.csv"
    dataColumn: "volume (kWh)"
    dateColumn: "validfrom (UTC)"
    conversionFactor: 0.00095  # Convert kW to MW and scale renewables to 95%
    startDate: "2025-01-01 00:00:00"
    endDate: "2025-01-30 23:00:00"

# Storage parameters
batteryStorage:
  energyCapacity: 6000 # MWh
  powerCapacity: 2000 # MW
  efficiency: 0.9
  initialSOC: 0 # as fraction of energyCapacity


# Demand parameters
demand:
  # Real data from Dutch system - January 2025 (kW data converted to MW)
  dataFile: "data/demand_data_2025_ned2.csv"
  dataColumn: "volume (kWh)"
  dateColumn: "validfrom (UTC)"
  conversionFactor: 0.001  # Convert kW to MW
  startDate: "01/01/2025 00:00"
  endDate: "30/01/2025 23:00"
  
  segments:
    Base:
      bidPrice: 300   # EUR/MWh (high willingness to pay)
      fraction: 0.90  # 90% of total load is base demand
    
    Flex:
      bidPrice: 50   # EUR/MWh (elastic, only if price low)  
      fraction: 0.10  # 10% of total load is flexible
