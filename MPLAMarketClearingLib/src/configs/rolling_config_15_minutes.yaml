# general parameters

strategy: rolling_with_ramps # strategy for clearing market
nTimesteps: 96 # number of timesteps in input data
timePeriodsPerDay: 96 # number of time periods in a day
clearForDays: 7 # number of days to clear market for
clearingInterval: 4 # number of time periods between market clearing/optimization rounds
clearingWindow: 96 # number of time periods to consider in each round
storageValue: 50 # experiment: value of stored MWh at end of window in objective function
noiseLevel: .1 # tweak noise magnitude in variable generators
lookAheadDistance: 0
marketGenerationStrategy: repeat

# Generator parameters
dispatchableGenerators:
 Base:
  bidPrice: 60 # EUR/MWh
  capacity: 1000 # MW
  rampRate: 2 # % of nominal power per minute
  initialQuantity: 1500
  emissionFactor: 980

 Shoulder:
  bidPrice: 90 # EUR/MWh
  capacity: 600 # MW
  rampRate: 6 # % of nominal power per minute
  initialQuantity: 0
  emissionFactor: 420

 Peak:
  bidPrice: 120 # EUR/MWh
  capacity: 400 # MW
  rampRate: 12 # % of nominal power per minute
  initialQuantity: 0
  emissionFactor: 420

variableGenerators:
  Wind:
    bidPrice: 0         # EUR/MWh
    capacity: 2000        # MW
    # Low at night, strong in the afternoon/evening, length = 24
